<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爱发电配置 - Afdian Settings</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
    }
    h1 { color: #333; margin-bottom: 8px; font-size: 24px; }
    .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
    .field { margin-bottom: 20px; }
    label { display: block; color: #333; font-weight: 500; margin-bottom: 8px; font-size: 14px; }
    .hint { color: #999; font-size: 12px; margin-top: 4px; }
    input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
    input:focus { outline: none; border-color: #667eea; }
    button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .back { margin-top: 20px; text-align: center; }
    .back a { color: #667eea; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Afdian API 配置</h1>
    <p class="subtitle">爱发电 API Configuration</p>
    <div class="field">
      <label for="token">API Token</label>
      <input type="password" id="token" placeholder="请输入 API Token">
      <p class="hint">在 https://ifdian.net/dashboard/dev 获取</p>
    </div>
    <div class="field">
      <label for="userId">User ID</label>
      <input type="text" id="userId" placeholder="请输入 User ID">
      <p class="hint">格式通常为 32 位十六进制字符串</p>
    </div>
    <button id="saveBtn" onclick="saveConfig()">保存配置</button>
    <div id="status" class="status" style="display:none;"></div>
    <div class="back"><a href="http://127.0.0.1:64117">返回 DSH</a></div>
  </div>
<script>
    const API_URL = "http://127.0.0.1:64117/plugins/dsh-afdian/config";
    async function loadConfig() {
      try {
        const res = await fetch(API_URL);
        const config = await res.json();
        document.getElementById("token").placeholder = config.tokenSet ? "已设置（留空保持不变）" : "未设置";
        document.getElementById("userId").value = config.userId || "";
        if (config.secure) {
          const badge = document.createElement("p");
          badge.textContent = "Token 已加密存储（AES-256-GCM）";
          badge.style.cssText = "color:#155724;font-size:13px;margin-top:10px;text-align:center;";
          document.querySelector(".container").appendChild(badge);
        }
      } catch(e) { showStatus("加载失败: " + e.message, "error"); }
    }
    async function saveConfig() {
      const token = document.getElementById("token").value.trim();
      const userId = document.getElementById("userId").value.trim();
      if (!userId) { showStatus("请填写 User ID", "error"); return; }
      const btn = document.getElementById("saveBtn");
      btn.disabled = true; btn.textContent = "保存中...";
      try {
        const payload = { userId };
        if (token) payload.token = token;
        const res = await fetch(API_URL, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        showStatus(res.ok ? "配置已保存！" : "保存失败", res.ok ? "success" : "error");
        if (res.ok) { document.getElementById("token").value = ""; loadConfig(); }
      } catch(e) { showStatus("网络错误: " + e.message, "error"); }
      finally { btn.disabled = false; btn.textContent = "保存配置"; }
    }
    function showStatus(msg, type) {
      const s = document.getElementById("status");
      s.textContent = msg; s.className = "status " + type; s.style.display = "block";
    }
    loadConfig();
  </script>
</body>
</html>
